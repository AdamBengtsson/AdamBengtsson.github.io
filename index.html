<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Today's Favorite Card</title>

    <!--
      This page is a simple static card UI with a name field.
      It keeps the layout lightweight and avoids a build tool.
      The Firebase logic is loaded separately so the page stays easy to maintain.
    -->
    <style>
      :root {
        --bg-dark: #121212;
        --bg-mid: #1d1d1d;
        --panel: rgba(15, 15, 15, 0.7);
        --text: #f5f5f5;
        --muted: rgba(255, 255, 255, 0.75);
        --accent: #d9d9d9;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
        color: var(--text);
        background:
          repeating-linear-gradient(
            135deg,
            var(--bg-dark) 0,
            var(--bg-dark) 20px,
            var(--bg-mid) 20px,
            var(--bg-mid) 40px
          );
      }

      .container {
        width: min(90vw, 800px);
        padding: 30px;
      }

      .box {
        background: var(--panel);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 18px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        padding: 24px 28px;
        margin: 18px 0;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      label {
        font-size: 0.8rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }

      input {
        width: 100%;
        padding: 14px 16px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        font-size: 1rem;
      }

      input:focus {
        outline: 2px solid rgba(255, 255, 255, 0.2);
        outline-offset: 2px;
      }

      h1 {
        font-size: clamp(2.2rem, 6vw, 4rem);
        line-height: 1.1;
        margin: 0;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      p {
        font-size: clamp(1.1rem, 2vw, 1.5rem);
        line-height: 1.6;
        margin: 0;
      }

      .status {
        font-size: 0.9rem;
        color: var(--muted);
        min-height: 1.2em;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <section class="box">
        <h1>TODAY'S FAVORITE CARD</h1>
      </section>

      <!--
        The name field is the primary UI element.
        The page updates the displayed card text as the user types.
      -->
      <section class="box field">
        <label for="nameInput">Your name</label>
        <input id="nameInput" type="text" maxlength="50" placeholder="Enter your name" />
        <p id="status" class="status" aria-live="polite">Loading saved name...</p>
      </section>

      <section class="box">
        <p id="cardText">This is a placeholder for the card text. Add your favorite card message here.</p>
      </section>
    </main>

    <!--
      Third-party scripts are loaded in order:
      1. Firebase app and Firestore compatibility libraries
      2. the project configuration object
      3. the app logic that handles save/load behavior
    -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="firebase-logic.js"></script>
  </body>
</html>
