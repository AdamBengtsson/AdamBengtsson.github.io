<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Today's Favorite Card</title>
    <style>
      :root {
        --bg-dark: #121212;
        --bg-mid: #1d1d1d;
        --panel: rgba(15, 15, 15, 0.7);
        --text: #f5f5f5;
        --muted: rgba(255, 255, 255, 0.75);
        --accent: #d9d9d9;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
        color: var(--text);
        background:
          repeating-linear-gradient(
            135deg,
            var(--bg-dark) 0,
            var(--bg-dark) 20px,
            var(--bg-mid) 20px,
            var(--bg-mid) 40px
          );
      }

      .container {
        width: min(90vw, 800px);
        padding: 30px;
      }

      .box {
        background: var(--panel);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 18px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        padding: 24px 28px;
        margin: 18px 0;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      label {
        font-size: 0.8rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }

      input {
        width: 100%;
        padding: 14px 16px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        font-size: 1rem;
      }

      input:focus {
        outline: 2px solid rgba(255, 255, 255, 0.2);
        outline-offset: 2px;
      }

      h1 {
        font-size: clamp(2.2rem, 6vw, 4rem);
        line-height: 1.1;
        margin: 0;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      p {
        font-size: clamp(1.1rem, 2vw, 1.5rem);
        line-height: 1.6;
        margin: 0;
      }

      .status {
        font-size: 0.9rem;
        color: var(--muted);
        min-height: 1.2em;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <section class="box">
        <h1>TODAY'S FAVORITE CARD</h1>
      </section>

      <section class="box field">
        <label for="nameInput">Your name</label>
        <input id="nameInput" type="text" maxlength="50" placeholder="Enter your name" />
        <p id="status" class="status" aria-live="polite">Loading saved name...</p>
      </section>

      <section class="box">
        <p id="cardText">This is a placeholder for the card text. Add your favorite card message here.</p>
      </section>
    </main>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDn60Wn-VFw8bN8qTFLZWoqWyb75ywNUao",
        authDomain: "cardnamer.firebaseapp.com",
        projectId: "cardnamer",
        storageBucket: "cardnamer.firebasestorage.app",
        messagingSenderId: "714456423379",
        appId: "1:714456423379:web:45edfb4d52f808e53e2d26",
        measurementId: "G-REER6KWHRM"
      };

      const STORAGE_KEY = "favorite-card-name";
      const nameInput = document.getElementById("nameInput");
      const statusText = document.getElementById("status");
      const cardText = document.getElementById("cardText");

      const isFirebaseConfigured = Object.values(firebaseConfig).every(
        (value) => typeof value === "string" && value && !value.startsWith("YOUR_")
      );

      let db = null;
      if (isFirebaseConfigured) {
        try {
          const app = initializeApp(firebaseConfig);
          db = getFirestore(app);
        } catch (error) {
          console.warn("Firebase initialization failed; using browser storage fallback.", error);
        }
      }

      function saveLocalName(value) {
        const trimmedValue = (value || "").trim();
        if (trimmedValue) {
          localStorage.setItem(STORAGE_KEY, trimmedValue);
        } else {
          localStorage.removeItem(STORAGE_KEY);
        }
      }

      function loadLocalName() {
        try {
          return localStorage.getItem(STORAGE_KEY) || "";
        } catch (error) {
          console.warn("Unable to read the browser storage value.", error);
          return "";
        }
      }

      function updateCardMessage(name) {
        const trimmedValue = (name || "").trim();
        if (!trimmedValue) {
          cardText.textContent = "This is a placeholder for the card text. Add your favorite card message here.";
          return;
        }
        cardText.textContent = `Hello, ${trimmedValue}! This is your saved name.`;
      }

      function setStatus(message) {
        statusText.textContent = message;
      }

      async function loadSavedName() {
        const fallbackName = loadLocalName();
        nameInput.value = fallbackName;
        updateCardMessage(fallbackName);

        if (!db) {
          setStatus("Using browser storage until Firebase is configured.");
          return;
        }

        try {
          const profileRef = doc(db, "profile", "currentName");
          const snapshot = await getDoc(profileRef);

          if (snapshot.exists() && snapshot.data().name) {
            const firebaseName = snapshot.data().name;
            nameInput.value = firebaseName;
            saveLocalName(firebaseName);
            updateCardMessage(firebaseName);
            setStatus("Loaded from Firebase.");
            return;
          }

          setStatus(fallbackName ? "Loaded from browser storage." : "No saved name yet.");
        } catch (error) {
          console.warn("Unable to read Firebase value; using browser storage.", error);
          setStatus("Loaded from browser storage.");
        }
      }

      async function saveName() {
        const trimmedValue = nameInput.value.trim();
        saveLocalName(trimmedValue);
        updateCardMessage(trimmedValue);

        if (!db) {
          setStatus(trimmedValue ? "Saved in this browser." : "Cleared from this browser.");
          return;
        }

        try {
          const profileRef = doc(db, "profile", "currentName");
          await setDoc(profileRef, { name: trimmedValue }, { merge: true });
          setStatus(trimmedValue ? "Saved to Firebase." : "Cleared from Firebase.");
        } catch (error) {
          console.warn("Firebase save failed, but browser storage was updated.", error);
          setStatus("Saved in this browser; Firebase save failed.");
        }
      }

      nameInput.addEventListener("input", saveName);
      loadSavedName();
    </script>
  </body>
</html>
